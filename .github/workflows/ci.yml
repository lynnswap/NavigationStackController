name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - LICENSE
  pull_request:
    paths-ignore:
      - README.md
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-63-tests:
    name: Package Tests (macOS 26, Xcode 26.4.1, Swift 6.3)
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks

      - name: Verify Swift 6.3
        run: |
          swift --version | grep -E '^Apple Swift version 6\.3([. ]|$)'

      - name: Run Swift package tests
        run: |
          swift test

  latest-macos-tests:
    name: Package Tests (macOS and iOS, Latest Xcode)
    runs-on: macos-26
    timeout-minutes: 60
    env:
      XCODE_MAJOR: '26'
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve latest stable Xcode
        run: |
          xcode_app="$(ruby <<'RUBY'
          xcode_major = ENV.fetch("XCODE_MAJOR")
          candidates = Dir["/Applications/Xcode_#{xcode_major}*.app"].select { |path| File.directory?(path) }

          def pre_release_xcode_path?(path)
            labels = [path, File.realpath(path)].map { |candidate| File.basename(candidate).downcase }
            labels.any? do |label|
              label.match?(/beta|release[ _-]?candidate|(?:^|[_. -])rc(?:$|[_. -])/)
            end
          end

          candidates = candidates.reject do |path|
            pre_release_xcode_path?(path)
          end

          def version_components(path)
            version = File.basename(path)[/Xcode_(\d+(?:\.\d+)*)/, 1]
            version.to_s.split(".").map(&:to_i)
          end

          selected = candidates.max_by { |path| version_components(path) }
          abort("No stable Xcode #{xcode_major} installation found") unless selected
          puts selected
          RUBY
          )"
          echo "DEVELOPER_DIR=${xcode_app}/Contents/Developer" >> "$GITHUB_ENV"
          echo "Resolved Xcode: ${xcode_app}"

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks

      - name: Start the iOS Simulator before building
        timeout-minutes: 2
        run: |
          simulator_id="$(xcrun simctl create "NavigationStackController CI" com.apple.CoreSimulator.SimDeviceType.iPhone-17)"
          echo "SIMULATOR_UDID=${simulator_id}" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id"

      - name: Run Swift package tests
        run: |
          swift test

      - name: Wait for the iOS Simulator
        timeout-minutes: 5
        run: xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Run UIKit package and consumer tests
        run: |
          destination="platform=iOS Simulator,id=${SIMULATOR_UDID}"
          ./Tools/test-uikit.sh "$destination" -parallel-testing-enabled NO

          cd Tools/UIKitConsumer
          xcodebuild -scheme UIKitConsumer -testPlan UIKitConsumer \
            -destination "$destination" -parallel-testing-enabled NO test

      - name: Verify obfuscated navigation runtime names
        run: |
          xcodebuild -project Tools/MiniApp/MiniApp.xcodeproj -scheme MiniApp \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/navigation-stack-release" \
            CODE_SIGNING_ALLOWED=NO build
          python3 Tools/check-private-symbols.py \
            "$RUNNER_TEMP/navigation-stack-release/Build/Products/Release-iphonesimulator/MiniApp.app"

      - name: Delete the test Simulator
        if: always() && env.SIMULATOR_UDID != ''
        timeout-minutes: 2
        run: xcrun simctl delete "$SIMULATOR_UDID"
